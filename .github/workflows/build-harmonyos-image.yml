name: Build HarmonyOS OCI image

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-harmonyos-image.yml'
      - 'images/harmonyos/**'
  workflow_dispatch:
    inputs:
      version:
        description: DevEco command-line tools version / image tag
        required: true
        default: 26.0.0.821
      image_name:
        description: GHCR image name
        required: true
        default: harmonyos-build-env
      api_tag:
        description: Additional moving tag for the SDK/API line
        required: true
        default: 26.0-api26
      sdk_asset:
        description: Release asset containing command-line-tools as tar.zst
        required: true
        default: command-line-tools-26.0.0.821.tar.zst
      sdk_sha256:
        description: SHA256 of the release asset
        required: true
        default: 6fe80eb986d13813882c231a3f1d1a881ba8891ec3059c727c9273e3580d7b88

permissions:
  contents: read
  packages: write

env:
  VERSION: ${{ github.event.inputs.version || '26.0.0.821' }}
  IMAGE_NAME: ${{ github.event.inputs.image_name || 'harmonyos-build-env' }}
  API_TAG: ${{ github.event.inputs.api_tag || '26.0-api26' }}
  SDK_ASSET: ${{ github.event.inputs.sdk_asset || 'command-line-tools-26.0.0.821.tar.zst' }}
  SDK_SHA256: ${{ github.event.inputs.sdk_sha256 || '6fe80eb986d13813882c231a3f1d1a881ba8891ec3059c727c9273e3580d7b88' }}

jobs:
  build:
    name: Build and publish HarmonyOS image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout image definitions
        uses: actions/checkout@v4

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker system prune -af || true
          df -h

      - name: Download command-line tools release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/harmonyos-sdk build/context
          gh release download "$VERSION" \
            --repo "${{ github.repository }}" \
            --pattern "$SDK_ASSET" \
            --dir /tmp/harmonyos-sdk
          echo "$SDK_SHA256  /tmp/harmonyos-sdk/$SDK_ASSET" | sha256sum -c -
          cp "/tmp/harmonyos-sdk/$SDK_ASSET" build/context/command-line-tools.tar.zst

      - name: Prepare Docker context
        run: cp images/harmonyos/Dockerfile build/context/Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: build/context
          file: build/context/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ env.API_TAG }}
          build-args: |
            IMAGE_DESCRIPTION=HarmonyOS command-line build environment ${{ env.VERSION }}
